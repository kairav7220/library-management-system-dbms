{% extends "payments.html" %}
{% block title %}Add Payment · Library{% endblock %}
{% block heading %}Add payment{% endblock %}
{% block content %}
<main class="panel">
  <div class="panel-head">
    <h2><i class="fa-solid fa-plus-circle"></i> Add payment</h2>
    <a href="{{ url_for('payments') }}" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back</a>
  </div>
  <form class="edit-form" method="POST" action="{{ url_for('add_payment') }}">
    <div class="form-row">
      <div class="form-group">
        <label for="payment_amount"><i class="fa-solid fa-dollar-sign"></i> Amount</label>
        <input id="payment_amount" type="number" step="0.01" name="payment_amount" required>
      </div>
      <div class="form-group">
        <label for="payment_type"><i class="fa-solid fa-tag"></i> Type</label>
        <input id="payment_type" type="text" name="payment_type" autocomplete="off">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="payment_mode"><i class="fa-solid fa-credit-card"></i> Mode</label>
        <input id="payment_mode" type="text" name="payment_mode" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="paid_by"><i class="fa-solid fa-user"></i> Paid by (member)</label>
        <select id="paid_by" name="paid_by">
          <option value="">Select member…</option>
          {% for m in members %}
            <option value="{{ m.id }}">{{ m.label }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-group">
      <label for="recieved_by"><i class="fa-solid fa-user-check"></i> Received by (employee)</label>
      <select id="recieved_by" name="recieved_by">
        <option value="">Select employee…</option>
        {% for e in employees %}
          <option value="{{ e.id }}">{{ e.label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-actions">
      <a href="{{ url_for('payments') }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">Add</button>
    </div>
  </form>
</main>
{% endblock %}
