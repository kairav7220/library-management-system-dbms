<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Library</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="page">
    <main class="panel login-panel">
      <div class="brand login-brand">
        <span class="brand-icon" aria-hidden="true">
          <i class="fa-solid fa-book"></i>
        </span>
        <div class="brand-text">
          <p class="eyebrow">Library Management</p>
          <h1>Sign in</h1>
        </div>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <p class="flash flash-{{ category }}">{{ message }}</p>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <p class="muted">Use your library account to continue.</p>

      <form class="login-form" method="POST" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" type="text" name="username" placeholder="e.g. admin" autofocus required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <div class="login-belt">
          <label class="remember">
            <input type="checkbox" name="remember" id="remember">
            <span>Remember me</span>
          </label>
          <button type="submit" class="btn btn-primary">Sign in</button>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
