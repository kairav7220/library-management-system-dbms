{% extends "book_genre.html" %}
{% block title %}Edit Book Genre · Library{% endblock %}
{% block heading %}Edit book genre{% endblock %}
{% block content %}
<main class="panel">
  <div class="panel-head">
    <h2><i class="fa-solid fa-book-circle-plus"></i> Edit genre</h2>
    <a href="{{ url_for('book_genre') }}" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back</a>
  </div>
  <form class="edit-form" method="POST" action="{{ url_for('edit_book_genre', row_num=row_num) }}">
    <div class="form-group">
      <label for="book_genre"><i class="fa-solid fa-masks-theater"></i> Genre name</label>
      <input id="book_genre" type="text" name="book_genre" value="{{ genre[0] }}" required>
    </div>
    <div class="form-actions">
      <a href="{{ url_for('book_genre') }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">Save changes</button>
    </div>
  </form>
</main>
{% endblock %}
