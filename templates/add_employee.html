{% extends "employees.html" %}
{% block title %}Add Employee · Library{% endblock %}
{% block heading %}Add employee{% endblock %}
{% block content %}
<main class="panel">
  <div class="panel-head">
    <h2><i class="fa-solid fa-user-plus"></i> Add employee</h2>
    <a href="{{ url_for('employees') }}" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back</a>
  </div>
  <form class="edit-form" method="POST" action="{{ url_for('add_employee') }}">
    <div class="form-row">
      <div class="form-group">
        <label for="name"><i class="fa-solid fa-user"></i> Name</label>
        <input id="name" type="text" name="name" required autocomplete="off">
      </div>
      <div class="form-group">
        <label for="designation"><i class="fa-solid fa-briefcase"></i> Designation</label>
        <input id="designation" type="text" name="designation" autocomplete="off">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="email"><i class="fa-solid fa-envelope"></i> Email</label>
        <input id="email" type="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="phone"><i class="fa-solid fa-phone"></i> Phone</label>
        <input id="phone" type="text" name="phone" autocomplete="off">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="salary"><i class="fa-solid fa-dollar-sign"></i> Salary</label>
        <input id="salary" type="text" name="salary" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="permanent_address"><i class="fa-solid fa-location-dot"></i> Permanent address</label>
        <input id="permanent_address" type="text" name="permanent_address" autocomplete="off">
      </div>
    </div>
    <div class="form-group">
      <label for="temporary_address"><i class="fa-solid fa-location-dot"></i> Temporary address</label>
      <input id="temporary_address" type="text" name="temporary_address" autocomplete="off">
    </div>
    <div class="form-actions">
      <a href="{{ url_for('employees') }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">Add</button>
    </div>
  </form>
</main>
{% endblock %}
