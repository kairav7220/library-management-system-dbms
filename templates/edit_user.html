{% extends "index.html" %}
{% block title %}Edit User · Library{% endblock %}
{% block heading %}Edit user{% endblock %}
{% block content %}
<main class="panel">
  <div class="panel-head">
    <h2><i class="fa-solid fa-user-pen"></i> Edit user</h2>
    <a href="{{ url_for('index') }}" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back</a>
  </div>
  <form class="edit-form" method="POST" action="{{ url_for('update_user', row_num=row_num) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <div class="form-row">
      <div class="form-group">
        <label for="user_id"><i class="fa-solid fa-id-badge"></i> User ID</label>
        <p class="readonly-id">{{ row[0] }}</p>
      </div>
      <div class="form-group">
        <label for="user_type"><i class="fa-solid fa-user-tag"></i> User type</label>
        <input id="user_type" type="text" name="user_type" value="{{ row[1] }}" required>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="username"><i class="fa-solid fa-user"></i> Username</label>
        <input id="username" type="text" name="username" value="{{ row[2] }}" required>
      </div>
      <div class="form-group">
        <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
        <input id="password" type="password" name="password" placeholder="Leave blank to keep current" autocomplete="new-password">
      </div>
    </div>
    <div class="form-group">
      <label for="email"><i class="fa-solid fa-envelope"></i> Email</label>
      <input id="email" type="email" name="email" value="{{ row[4] }}" required>
    </div>
    <div class="form-actions">
      <a href="{{ url_for('index') }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">Save changes</button>
    </div>
  </form>
</main>
{% endblock %}
