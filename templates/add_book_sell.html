{% extends "book_sell.html" %}
{% block title %}Add Book Sell · Library{% endblock %}
{% block heading %}Add book sell{% endblock %}
{% block content %}
<main class="panel">
  <div class="panel-head">
    <h2><i class="fa-solid fa-book-circle-plus"></i> Add sell record</h2>
    <a href="{{ url_for('book_sell') }}" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back</a>
  </div>
  <form class="edit-form" method="POST" action="{{ url_for('add_book_sell') }}">
    <div class="form-row">
      <div class="form-group">
        <label for="book_id"><i class="fa-solid fa-book"></i> Book</label>
        <select id="book_id" name="book_id" required>
          <option value="">Select book…</option>
          {% for b in books %}
            <option value="{{ b.id }}" data-name="{{ b.name }}" data-price="{{ b.price }}">{{ b.label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label for="book_name"><i class="fa-solid fa-heading"></i> Book name</label>
        <input id="book_name" type="text" name="book_name" required autocomplete="off">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="book_price"><i class="fa-solid fa-dollar-sign"></i> Price</label>
        <input id="book_price" type="number" step="0.01" name="book_price" required>
      </div>
      <div class="form-group">
        <label for="mem_id"><i class="fa-solid fa-user"></i> Member</label>
        <select id="mem_id" name="mem_id" required>
          <option value="">Select member…</option>
          {% for m in members %}
            <option value="{{ m.id }}">{{ m.label }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-actions">
      <a href="{{ url_for('book_sell') }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">Add</button>
    </div>
  </form>

  <script>
    const bookSel = document.getElementById('book_id');
    const nameInput = document.getElementById('book_name');
    const priceInput = document.getElementById('book_price');
    if (bookSel) {
      bookSel.addEventListener('change', () => {
        const opt = bookSel.selectedOptions[0];
        nameInput.value = opt ? (opt.dataset.name || '') : '';
        priceInput.value = opt ? (opt.dataset.price || '') : '';
      });
    }
  </script>
</main>
{% endblock %}
