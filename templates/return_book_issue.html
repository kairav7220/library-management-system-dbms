{% extends "book_issue.html" %}
{% block title %}Return Book · Library{% endblock %}
{% block heading %}Return book{% endblock %}
{% block content %}
<main class="panel">
  <div class="panel-head">
    <h2><i class="fa-solid fa-rotate-left"></i> Return book</h2>
    <a href="{{ url_for('book_issue') }}" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back</a>
  </div>
  <form class="edit-form" method="POST" action="{{ url_for('return_book_issue', row_num=row_num) }}">
    <div class="form-group">
      <label for="recieved_by"><i class="fa-solid fa-user-check"></i> Received by (employee)</label>
      <select id="recieved_by" name="recieved_by" required>
        <option value="" disabled selected>Select employee</option>
        {% for emp in employees %}
        <option value="{{ emp.id }}">{{ emp.label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-actions">
      <a href="{{ url_for('book_issue') }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">Mark returned</button>
    </div>
  </form>
</main>
{% endblock %}
