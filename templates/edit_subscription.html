{% extends "subscriptions.html" %}
{% block title %}Edit Subscription · Library{% endblock %}
{% block heading %}Edit subscription{% endblock %}
{% block content %}
<main class="panel">
  <div class="panel-head">
    <h2><i class="fa-solid fa-pen-to-square"></i> Edit subscription</h2>
    <a href="{{ url_for('subscriptions') }}" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back</a>
  </div>
  <form class="edit-form" method="POST" action="{{ url_for('edit_subscription', row_num=row_num) }}">
    <div class="form-row">
      <div class="form-group">
        <label for="mem_id"><i class="fa-solid fa-user"></i> Member ID</label>
        <input id="mem_id" type="text" name="mem_id" value="{{ subscription[1] }}" required>
      </div>
      <div class="form-group">
        <label for="plan_mode"><i class="fa-solid fa-clock"></i> Plan mode</label>
        <input id="plan_mode" type="text" name="plan_mode" value="{{ subscription[0] }}" required>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="mem_subscription_amount"><i class="fa-solid fa-dollar-sign"></i> Amount</label>
        <input id="mem_subscription_amount" type="number" step="0.01" name="mem_subscription_amount" value="{{ subscription[2] }}" required>
      </div>
      <div class="form-group">
        <label for="plan_type"><i class="fa-solid fa-tag"></i> Plan type</label>
        <input id="plan_type" type="text" name="plan_type" value="{{ subscription[3] }}">
      </div>
    </div>
    <div class="form-actions">
      <a href="{{ url_for('subscriptions') }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">Save changes</button>
    </div>
  </form>
</main>
{% endblock %}
