{% extends "employees.html" %}
{% block title %}Edit Employee · Library{% endblock %}
{% block heading %}Edit employee{% endblock %}
{% block content %}
<main class="panel">
  <div class="panel-head">
    <h2><i class="fa-solid fa-user-pen"></i> Edit employee</h2>
    <a href="{{ url_for('employees') }}" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back</a>
  </div>
  <form class="edit-form" method="POST" action="{{ url_for('edit_employee', row_num=row_num) }}">
    <div class="form-row">
      <div class="form-group">
        <label for="emp_id"><i class="fa-solid fa-id-badge"></i> Employee ID</label>
        <p class="readonly-id">{{ employee[1] }}</p>
      </div>
      <div class="form-group">
        <label for="name"><i class="fa-solid fa-user"></i> Name</label>
        <input id="name" type="text" name="name" value="{{ employee[2] }}" required>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
        <input id="password" type="password" name="password" value="{{ employee[4] }}">
      </div>
      <div class="form-group">
        <label for="email"><i class="fa-solid fa-envelope"></i> Email</label>
        <input id="email" type="email" name="email" value="{{ employee[5] }}" required>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="phone"><i class="fa-solid fa-phone"></i> Phone</label>
        <input id="phone" type="text" name="phone" value="{{ employee[6] }}">
      </div>
      <div class="form-group">
        <label for="designation"><i class="fa-solid fa-briefcase"></i> Designation</label>
        <input id="designation" type="text" name="designation" value="{{ employee[7] }}">
      </div>
    </div>
    <div class="form-group">
      <label for="salary"><i class="fa-solid fa-dollar-sign"></i> Salary</label>
      <input id="salary" type="text" name="salary" value="{{ employee[8] }}">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="permanent_address"><i class="fa-solid fa-location-dot"></i> Permanent address</label>
        <input id="permanent_address" type="text" name="permanent_address" value="{{ employee[10] }}">
      </div>
      <div class="form-group">
        <label for="temporary_address"><i class="fa-solid fa-location-dot"></i> Temporary address</label>
        <input id="temporary_address" type="text" name="temporary_address" value="{{ employee[11] }}">
      </div>
    </div>
    <div class="form-actions">
      <a href="{{ url_for('employees') }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">Save changes</button>
    </div>
  </form>
</main>
{% endblock %}
