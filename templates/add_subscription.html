{% extends "subscriptions.html" %}
{% block title %}Add Subscription · Library{% endblock %}
{% block heading %}Add subscription{% endblock %}
{% block content %}
<main class="panel">
  <div class="panel-head">
    <h2><i class="fa-solid fa-plus-circle"></i> Add subscription</h2>
    <a href="{{ url_for('subscriptions') }}" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back</a>
  </div>
  <form class="edit-form" method="POST" action="{{ url_for('add_subscription') }}">
    <div class="form-row">
      <div class="form-group">
        <label for="mem_id"><i class="fa-solid fa-user"></i> Member</label>
        <select id="mem_id" name="mem_id" required>
          <option value="">Select member…</option>
          {% for m in members %}
            <option value="{{ m.id }}">{{ m.label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label for="plan_mode"><i class="fa-solid fa-clock"></i> Plan mode</label>
        <input id="plan_mode" type="text" name="plan_mode" placeholder="monthly / yearly" required>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="mem_subscription_amount"><i class="fa-solid fa-dollar-sign"></i> Amount</label>
        <input id="mem_subscription_amount" type="number" step="0.01" name="mem_subscription_amount" required>
      </div>
      <div class="form-group">
        <label for="plan_type"><i class="fa-solid fa-tag"></i> Plan type</label>
        <input id="plan_type" type="text" name="plan_type" autocomplete="off">
      </div>
    </div>
    <div class="form-actions">
      <a href="{{ url_for('subscriptions') }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">Add</button>
    </div>
  </form>
</main>
{% endblock %}
