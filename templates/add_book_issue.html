{% extends "book_issue.html" %}
{% block title %}Add Book Issue · Library{% endblock %}
{% block heading %}Add book issue{% endblock %}
{% block content %}
<main class="panel">
  <div class="panel-head">
    <h2><i class="fa-solid fa-book-circle-plus"></i> Add book issue</h2>
    <a href="{{ url_for('book_issue') }}" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back</a>
  </div>
  <form class="edit-form" method="POST" action="{{ url_for('add_book_issue') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <div class="form-row">
      <div class="form-group">
        <label for="book_id"><i class="fa-solid fa-book"></i> Book</label>
        <select id="book_id" name="book_id" required>
          <option value="">Select book…</option>
          {% for b in books %}
            <option value="{{ b.id }}">{{ b.label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label for="issued_to"><i class="fa-solid fa-user"></i> Issued to (member)</label>
        <select id="issued_to" name="issued_to" required>
          <option value="">Select member…</option>
          {% for m in members %}
            <option value="{{ m.id }}">{{ m.label }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="issued_date"><i class="fa-solid fa-calendar"></i> Issue date</label>
        <input id="issued_date" type="text" name="issued_date" placeholder="YYYY-MM-DD" required>
      </div>
      <div class="form-group">
        <label for="recieved_by"><i class="fa-solid fa-user-check"></i> Received by (employee)</label>
        <select id="recieved_by" name="recieved_by">
          <option value="">Select employee…</option>
          {% for e in employees %}
            <option value="{{ e.id }}">{{ e.label }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-actions">
      <a href="{{ url_for('book_issue') }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">Add</button>
    </div>
  </form>
</main>
{% endblock %}
