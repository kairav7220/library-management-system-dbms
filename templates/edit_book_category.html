{% extends "book_category.html" %}
{% block title %}Edit Book Category · Library{% endblock %}
{% block heading %}Edit book category{% endblock %}
{% block content %}
<main class="panel">
  <div class="panel-head">
    <h2><i class="fa-solid fa-book-circle-plus"></i> Edit category</h2>
    <a href="{{ url_for('book_category') }}" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back</a>
  </div>
  <form class="edit-form" method="POST" action="{{ url_for('edit_book_category', row_num=row_num) }}">
    <div class="form-group">
      <label for="book_cat"><i class="fa-solid fa-tag"></i> Category name</label>
      <input id="book_cat" type="text" name="book_cat" value="{{ book_cat[0] }}" required>
    </div>
    <div class="form-group">
      <label for="book_cat_desc"><i class="fa-solid fa-align-left"></i> Description</label>
      <input id="book_cat_desc" type="text" name="book_cat_desc" value="{{ book_cat[1] }}">
    </div>
    <div class="form-actions">
      <a href="{{ url_for('book_category') }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">Save changes</button>
    </div>
  </form>
</main>
{% endblock %}
