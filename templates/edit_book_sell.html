{% extends "book_sell.html" %}
{% block title %}Edit Book Sell · Library{% endblock %}
{% block heading %}Edit book sell{% endblock %}
{% block content %}
<main class="panel">
  <div class="panel-head">
    <h2><i class="fa-solid fa-book-circle-plus"></i> Edit sell record</h2>
    <a href="{{ url_for('book_sell') }}" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back</a>
  </div>
  <form class="edit-form" method="POST" action="{{ url_for('edit_book_sell', row_num=row_num) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <div class="form-row">
      <div class="form-group">
        <label for="order_id"><i class="fa-solid fa-receipt"></i> Order ID</label>
        <p class="readonly-id">{{ sell[1] }}</p>
      </div>
      <div class="form-group">
        <label for="book_id"><i class="fa-solid fa-book"></i> Book</label>
        <select id="book_id" name="book_id" required>
          {% for b in books %}
            <option value="{{ b.id }}" data-name="{{ b.name }}" data-price="{{ b.price }}"
              {% if b.id == sell[4] %}selected{% endif %}>{{ b.label }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="book_name"><i class="fa-solid fa-heading"></i> Book name</label>
        <input id="book_name" type="text" name="book_name" value="{{ sell[5] }}" required>
      </div>
      <div class="form-group">
        <label for="book_price"><i class="fa-solid fa-dollar-sign"></i> Price</label>
        <input id="book_price" type="number" step="0.01" name="book_price" value="{{ sell[6] }}" required>
      </div>
    </div>
    <div class="form-group">
      <label for="mem_id"><i class="fa-solid fa-user"></i> Member</label>
      <select id="mem_id" name="mem_id" required>
        {% for m in members %}
          <option value="{{ m.id }}" {% if m.id == sell[7] %}selected{% endif %}>{{ m.label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-actions">
      <a href="{{ url_for('book_sell') }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">Save changes</button>
    </div>
  </form>

  <script>
    const bookSel = document.getElementById('book_id');
    const nameInput = document.getElementById('book_name');
    const priceInput = document.getElementById('book_price');
    if (bookSel) {
      bookSel.addEventListener('change', () => {
        const opt = bookSel.selectedOptions[0];
        nameInput.value = opt ? (opt.dataset.name || nameInput.value) : nameInput.value;
        priceInput.value = opt ? (opt.dataset.price || priceInput.value) : priceInput.value;
      });
    }
  </script>
    <div class="form-actions">
      <a href="{{ url_for('book_sell') }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">Save changes</button>
    </div>
  </form>
</main>
{% endblock %}
