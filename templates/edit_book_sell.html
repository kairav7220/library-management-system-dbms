{% extends "book_sell.html" %}
{% block title %}Edit Book Sell · Library{% endblock %}
{% block heading %}Edit book sell{% endblock %}
{% block content %}
<main class="panel">
  <div class="panel-head">
    <h2><i class="fa-solid fa-book-circle-plus"></i> Edit sell record</h2>
    <a href="{{ url_for('book_sell') }}" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back</a>
  </div>
  <form class="edit-form" method="POST" action="{{ url_for('edit_book_sell', row_num=row_num) }}">
    <div class="form-row">
      <div class="form-group">
        <label for="book_id"><i class="fa-solid fa-book"></i> Book ID</label>
        <input id="book_id" type="text" name="book_id" value="{{ sell[0] }}" required>
      </div>
      <div class="form-group">
        <label for="book_name"><i class="fa-solid fa-heading"></i> Book name</label>
        <input id="book_name" type="text" name="book_name" value="{{ sell[1] }}" required>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="book_price"><i class="fa-solid fa-dollar-sign"></i> Price</label>
        <input id="book_price" type="number" step="0.01" name="book_price" value="{{ sell[2] }}" required>
      </div>
      <div class="form-group">
        <label for="mem_id"><i class="fa-solid fa-user"></i> Member ID</label>
        <input id="mem_id" type="text" name="mem_id" value="{{ sell[3] }}" required>
      </div>
    </div>
    <div class="form-actions">
      <a href="{{ url_for('book_sell') }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">Save changes</button>
    </div>
  </form>
</main>
{% endblock %}
